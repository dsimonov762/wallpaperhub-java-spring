# Pull requests and pushes to master. Jobs: build (Maven), template (contracts/ is the pinned copy), conformance (the service in Docker, held to
# docs/SERVICE-SPEC.md of the template by its conformance suite), and ok, the one check the ruleset of master requires (docs/adr/0023 of the template).
# Actions are pinned to a major version; Renovate bumps them.
name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: ./mvnw verify
        run: ./mvnw -B -ntp verify

  template:
    name: contracts match the pinned template
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/template.sh check

  conformance:
    name: conformance ${{ matrix.service }}
    needs: [build, template]
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: [account]
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the pinned template
        run: scripts/template.sh ensure
      - name: Install Hurl
        run: .template/scripts/ci/install-hurl.sh
      - name: Hurl needs libxml2.so.2 (Ubuntu 26.04 only ships libxml2.so.16)
        run: |
          lib="/usr/lib/$(uname -m)-linux-gnu"
          if ! ldconfig -p | grep -q 'libxml2\.so\.2 '; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libxml2-16
            sudo ln -sf "$lib/libxml2.so.16" "$lib/libxml2.so.2"
            sudo ldconfig
          fi
          hurl --version
      - run: make env
      # With the observability stack: T1-T3 look for the request in Tempo, Loki and Prometheus (about 6.5 GB; the runner has 16 GB)
      - name: Infrastructure, schemas and observability
        run: make up-obs
      # GET /users/me for alice needs her row in account's database (the seed gives the users the ids of their Keycloak subjects)
      - name: Development data
        run: make seed
      - name: Build and start the service
        env:
          SERVICE: ${{ matrix.service }}
        run: make run SVC="$SERVICE"
      - name: Conformance
        env:
          SERVICE: ${{ matrix.service }}
        run: make conformance SVC="$SERVICE" ARGS="--lifecycle"
      - name: Collect logs
        if: failure()
        run: .template/scripts/ci/collect-logs.sh ci-logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-${{ matrix.service }}
          path: ci-logs/
      - name: Stop
        if: always()
        run: make down

  ok:
    name: ok
    if: always()
    needs: [build, template, conformance]
    runs-on: ubuntu-26.04
    steps:
      - name: Every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
