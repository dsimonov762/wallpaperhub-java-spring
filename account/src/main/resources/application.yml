# account-service. What every service shares is in the platform module; the environment variables are listed in docs/SERVICE-SPEC.md of the template.
spring:
  config:
    import: classpath:wallpaperhub-platform.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000       # ms: a dead database must fail a request (and /health/ready) quickly, not hang it
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate             # the schema is contracts/db-schema (make schemas); a service never creates tables
    properties:
      hibernate.jdbc.time_zone: UTC
